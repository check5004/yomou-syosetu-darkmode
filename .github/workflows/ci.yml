name: CI and ZIP Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Test and package extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check manifest, scripts and release version
        run: npm run check
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - name: Run tests
        run: npm test
      - name: Build ZIP and SHA-256 checksum
        run: npm run package
      - name: Verify ZIP contents and checksum independently
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check --strict *.sha256
          unzip -t yomou-darkmode-*.zip
      - name: Save distributable files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-dist
          path: |
            dist/yomou-darkmode-*.zip
            dist/yomou-darkmode-*.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-dist
          path: dist
      - name: Publish ZIP and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          zip="yomou-darkmode-${version}.zip"
          (cd dist && sha256sum --check --strict "${zip}.sha256")

          # A completed release is never silently replaced on a rerun.
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/release-draft")" == 'false' ]]; then
              mkdir -p "$RUNNER_TEMP/published-assets"
              gh release download "$RELEASE_TAG" --pattern "$zip" --pattern "${zip}.sha256" --dir "$RUNNER_TEMP/published-assets"
              cmp "dist/$zip" "$RUNNER_TEMP/published-assets/$zip"
              cmp "dist/${zip}.sha256" "$RUNNER_TEMP/published-assets/${zip}.sha256"
              echo "Release already published with identical assets."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "読もう、夜。 ${RELEASE_TAG}" --notes-file RELEASE_NOTES.md
          fi

          gh release upload "$RELEASE_TAG" "dist/$zip" "dist/${zip}.sha256" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file RELEASE_NOTES.md
          gh release view "$RELEASE_TAG" --json url --jq '.url'
